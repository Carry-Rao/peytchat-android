[package]
name = "peytchat-bridge"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
peyt-envelope = { path = "../peyt-envelope" }
peytchat-plugins = { path = "../peytchat-plugins" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
